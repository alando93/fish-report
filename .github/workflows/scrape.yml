name: Scrape Fishing Reports

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD). Leave blank to use the default rolling window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end date (YYYY-MM-DD). Leave blank to use the default rolling window.'
        required: false
        default: ''
      days:
        description: 'Rolling lookback window in days (used only when start/end dates are blank).'
        required: false
        default: '14'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      run: |
        START="${{ github.event.inputs.start_date }}"
        END="${{ github.event.inputs.end_date }}"
        DAYS="${{ github.event.inputs.days }}"
        DAYS="${DAYS:-14}"

        if [ -n "$START" ] && [ -n "$END" ]; then
          echo "Backfill mode: $START → $END"
          python automated_scraping/scripts/sandiego_fish_reports_scraper.py \
            --start_date "$START" --end_date "$END"
        else
          echo "Rolling window mode: last $DAYS days"
          python automated_scraping/scripts/sandiego_fish_reports_scraper.py --days "$DAYS"
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/
        git commit -m "Update fishing reports data" || echo "No changes to commit"
        git push
