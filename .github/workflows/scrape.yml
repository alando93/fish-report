name: Scrape Fishing Reports

# Manual fallback only. The scheduled scraper runs on the OptiPlex
# (fish-scrape.timer, scrape_run.sh) and is the only regular data writer.
# This workflow is disabled in GitHub too; `gh workflow enable` before dispatching,
# and stop the OptiPlex timer first so two writers don't race.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD). Leave blank to use the default rolling window.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end date (YYYY-MM-DD). Leave blank to use the default rolling window.'
        required: false
        default: ''
      days:
        description: 'Rolling lookback window in days (used only when start/end dates are blank).'
        required: false
        default: '2'
      site:
        description: 'Region to scrape (sandiego, socal or norcal). Leave blank for all.'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      run: |
        START="${{ github.event.inputs.start_date }}"
        END="${{ github.event.inputs.end_date }}"
        DAYS="${{ github.event.inputs.days }}"
        DAYS="${DAYS:-2}"
        SITE_ARGS=()
        if [ -n "${{ github.event.inputs.site }}" ]; then
          SITE_ARGS=(--site "${{ github.event.inputs.site }}")
        fi

        if [ -n "$START" ] && [ -n "$END" ]; then
          echo "Backfill mode: $START → $END"
          python automated_scraping/scripts/fish_reports_scraper.py "${SITE_ARGS[@]}" \
            --start_date "$START" --end_date "$END"
        else
          echo "Rolling window mode: last $DAYS days"
          python automated_scraping/scripts/fish_reports_scraper.py "${SITE_ARGS[@]}" --days "$DAYS"
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/
        git commit -m "Update fishing reports data" || echo "No changes to commit"
        git push
