<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <nav class="navbar is-primary app-navbar" role="navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="./">
                <i class="fas fa-fish mr-2"></i>
                <span class="has-text-weight-bold">Fishing Dashboard</span>
            </a>
            <div class="navbar-item region-select">
                <label for="regionSelect" class="is-sr-only">Region</label>
                <select id="regionSelect"></select>
            </div>
        </div>
    </nav>

    <div class="tab-bar" role="tablist">
        <div class="container">
            <button class="tab-btn" role="tab" data-tab="daily">Daily Reports</button>
            <button class="tab-btn" role="tab" data-tab="trends">Trends</button>
            <button class="tab-btn" role="tab" data-tab="moon">Moon Calendar</button>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div id="reportsSection"  class="tab-panel" data-tab="daily"></div>
            <div id="trendsSection"   class="tab-panel" data-tab="trends" hidden></div>
            <div id="calendarSection" class="tab-panel" data-tab="moon"   hidden></div>

            <footer class="mt-6 has-text-centered has-text-grey">
                <p id="lastUpdated">Last updated: Loading...</p>
                <p class="mt-2" style="font-size: 12px;">
                    Data scraped every 4 hours from
                    <a id="sourceLink" href="#" target="_blank" rel="noopener"></a>.
                </p>
                <p class="mt-1" style="font-size: 12px;">
                    Moon phases computed from the
                    <a href="https://en.wikipedia.org/wiki/Lunar_phase" target="_blank" rel="noopener">synodic lunar cycle</a>
                    (29.530588 days, anchored to the 2000-01-06 new moon).
                </p>
                <p class="mt-2">
                    <a href="https://github.com/alando93/fish-report" target="_blank" rel="noopener">
                        <i class="fab fa-github mr-1"></i>View on GitHub
                    </a>
                </p>
            </footer>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="static/js/moon.js"></script>
    <script src="static/js/ui.js"></script>
    <script src="static/js/tripDuration.js"></script>
    <script src="static/js/trends.js"></script>
    <script src="static/js/moonCalendar.js"></script>
    <script src="static/js/dashboard.js"></script>
</body>
</html>
